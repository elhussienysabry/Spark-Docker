name: spark

# Shared settings for the three Spark daemons (master, workers, history).
x-spark-common: &spark-common
  image: spark-local:4.2.1
  build:
    context: .
    dockerfile: Dockerfile.spark
  restart: unless-stopped
  networks:
    - spark-net
  environment: &spark-env
    SPARK_CONF_DIR: /opt/spark-conf
    TZ: ${TZ:-Africa/Cairo}
    # Put the Spark binaries on PATH (the official image does not do this).
    PATH: /opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  volumes:
    - ./conf:/opt/spark-conf:ro,z
    - ./apps:/opt/spark-apps:ro,z
    - ./data:/opt/spark-data:rw,z
    - ./events:/opt/spark-events:rw,z

services:
  # ---------------------------------------------------------------------------
  # Standalone cluster master: schedules applications on the workers.
  # UI: http://localhost:8080   |   RPC: spark://localhost:7077
  # ---------------------------------------------------------------------------
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      <<: *spark-env
      SPARK_DAEMON_MEMORY: 1g
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4041:4040"   # driver UI for jobs submitted from spark-master
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Worker 1: 2 cores / 4 GiB of executor capacity. UI on localhost:8081.
  # ---------------------------------------------------------------------------
  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-1
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-4g}"
      - --webui-port
      - "8081"
    environment:
      <<: *spark-env
      SPARK_DAEMON_MEMORY: 1g
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Worker 2: same capacity as worker 1. UI on localhost:8082.
  # ---------------------------------------------------------------------------
  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-2
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-4g}"
      - --webui-port
      - "8081"
    environment:
      <<: *spark-env
      SPARK_DAEMON_MEMORY: 1g
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      spark-master:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # History Server: serves completed application UIs from ./events.
  # UI: http://localhost:18080
  # ---------------------------------------------------------------------------
  spark-history:
    <<: *spark-common
    container_name: spark-history
    hostname: spark-history
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      <<: *spark-env
      SPARK_DAEMON_MEMORY: 1g
    # Notebook drivers write event logs as UID 1000, GID 100 (users).
    group_add:
      - "100"
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # JupyterLab + PySpark 4.2.1 (same version as the cluster).
  # UI: http://localhost:8888/?token=spark
  # Spark driver UI for a running app: http://localhost:4040
  # ---------------------------------------------------------------------------
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.1
    container_name: spark-jupyter
    hostname: jupyter
    restart: unless-stopped
    networks:
      - spark-net
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-spark}
      SPARK_MASTER: spark://spark-master:7077
      # Use the same read-only Spark defaults as the cluster daemons.
      SPARK_CONF_DIR: /opt/spark-conf
      # Make the PySpark bundled with SPARK_HOME importable by the Jupyter kernel.
      PYTHONPATH: /usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - ./notebooks:/home/jovyan/work:rw,z
      - ./conf:/opt/spark-conf:ro,z
      - ./apps:/opt/spark-apps:ro,z
      - ./data:/opt/spark-data:rw,z
      - ./events:/opt/spark-events:rw,z
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    depends_on:
      spark-master:
        condition: service_healthy

networks:
  spark-net:
    driver: bridge

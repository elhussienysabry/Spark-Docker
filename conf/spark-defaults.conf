# ---------------------------------------------------------------------------
# Spark 4.2.1 defaults shared by master, workers and the history server.
# Mounted read-only at /opt/spark-conf inside the Spark containers.
# ---------------------------------------------------------------------------

# Default master for spark-submit / spark-shell run inside the cluster
spark.master                        spark://spark-master:7077

# Event logging + History Server
spark.eventLog.enabled              true
spark.eventLog.dir                  file:///opt/spark-events
spark.history.fs.logDirectory       file:///opt/spark-events
spark.history.ui.port               18080
spark.history.retainedApplications  50
spark.history.fs.cleaner.enabled    true
spark.history.fs.cleaner.interval   1d
spark.history.fs.cleaner.maxAge     7d

# Resources for applications submitted from inside the cluster
spark.driver.memory                 1g
spark.executor.memory               2g
spark.executor.cores                1

# SQL / DataFrame tuning for a small local cluster
spark.sql.adaptive.enabled                     true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.shuffle.partitions                   8
spark.sql.warehouse.dir                        file:///opt/spark-data/warehouse

# Keep files created by jobs manageable from the host and from Jupyter.
spark.hadoop.fs.permissions.umask-mode  000

# Faster serialization
spark.serializer                    org.apache.spark.serializer.KryoSerializer

# Driver UI port (mapped to localhost:4040 by the Jupyter service)
spark.ui.port                       4040
